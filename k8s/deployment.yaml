# Deployment fuer dotnetrest.
# Deckt GC-/Ressourcen-Sizing, Security-Context, Probes, Graceful Shutdown und das
# /app/config-Overlay ab (siehe Program.cs). HPA, Secret-Erstellung und
# topologySpreadConstraints sind separate Folgeschritte.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dotnetrest
spec:
  # 2 Replicas + PodDisruptionBudget (pdb.yaml): ein Node-Drain nimmt nie beide
  # Pods gleichzeitig weg.
  replicas: 2
  selector:
    matchLabels:
      app: dotnetrest
  template:
    metadata:
      labels:
        app: dotnetrest
        version: v1 # Istio-Konvention: wird fuer Telemetrie/Subsets ausgewertet
    spec:
      # SIGTERM -> preStop-Sleep (Endpoint-Controller entfernt den Pod aus dem
      # Service) -> ShutdownTimeout in Program.cs (30s) -> harter Kill.
      # terminationGracePeriodSeconds muss preStop-Sleep + ShutdownTimeout ueberdauern.
      terminationGracePeriodSeconds: 45
      # Die App spricht nicht mit der Kubernetes-API -> kein Token im Pod.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654 # $APP_UID aus dem Dockerfile
        runAsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dotnetrest
          image: wlanboy/dotnet-container:latest
          ports:
            - name: http-dotnetrest # Name muss zum Service-Port passen, siehe service.yaml
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # GC: Workstation-GC (Default). Server-GC (DOTNET_gcServer=1) bringt bei
          # 1 CPU-Limit nichts, gemessen kein Durchsatz-Unterschied.
          # Heap-Limit: .NET setzt im Container ohne weitere Angabe 75 % des
          # cgroup-Memory-Limits als GCHeapHardLimit, daher keine DOTNET_GC*-Variablen.
          resources:
            # Gemessen: 11-18 MiB RSS unter Last (docker, 2 CPU). Istio-Sidecar hat
            # eigene Requests/Limits, die hier nicht mitzaehlen.
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "1"
              memory: "96Mi"
          # Native AOT startet in Millisekunden -> keine startupProbe noetig.
          # Liveness reagiert langsamer als Readiness: ein kurz ueberlasteter Pod
          # faellt erst aus dem Service, bevor er neu gestartet wird.
          readinessProbe:
            httpGet: { path: /health/ready, port: 8080 }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health/live, port: 8080 }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
          volumeMounts:
            - name: config-overlay
              mountPath: /app/config
              readOnly: true
      volumes:
        # ConfigMap "dotnetrest-config" muss separat angelegt werden (Key:
        # appsettings.Production.json). optional: true, damit der Pod auch
        # ohne diese ConfigMap startet -> appsettings.json aus dem Image greift dann.
        - name: config-overlay
          configMap:
            name: dotnetrest-config
            optional: true
