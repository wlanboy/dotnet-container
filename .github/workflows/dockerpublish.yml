name: Docker build and publish image
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Log in to Docker Hub
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Determine image tag
      id: vars
      run: |
        if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
          echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
        else
          echo "tag=manual-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
        fi

    - name: Build the Docker image
      run: |
        docker build \
          --build-arg REVISION=${{ github.sha }} \
          -t wlanboy/dotnet-container:${STEPS_VARS_OUTPUTS_TAG} \
          -t wlanboy/dotnet-container:latest \
          ./dotnetrest
      env:
        STEPS_VARS_OUTPUTS_TAG: ${{ steps.vars.outputs.tag }}
    - name: Docker Push
      run: |
        docker push wlanboy/dotnet-container:${STEPS_VARS_OUTPUTS_TAG}
        docker push wlanboy/dotnet-container:latest
      env:
        STEPS_VARS_OUTPUTS_TAG: ${{ steps.vars.outputs.tag }}
